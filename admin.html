<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Firebase Admin Panel - BadiniMovies</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }
        body {
            background: #0c0b14;
            color: #f0eef7;
            font-family: 'Segoe UI', Roboto, 'Inter', system-ui, sans-serif;
            padding: 24px 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: #1a1728;
            border-radius: 2rem;
            padding: 1.8rem 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6);
        }
        /* login box */
        .login-box {
            max-width: 440px;
            margin: 12vh auto;
            background: #1a1728;
            padding: 2rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        input, textarea, select {
            width: 100%;
            margin: 8px 0 18px 0;
            padding: 12px 16px;
            border-radius: 1.5rem;
            border: none;
            background: #2f2b45;
            color: white;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            background: #3d3761;
            outline: none;
            box-shadow: 0 0 0 2px #e4b363;
        }
        button, .btn-like {
            background: #e4b363;
            border: none;
            padding: 10px 24px;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            color: #0c0b14;
            transition: 0.2s;
        }
        button:hover { background: #f3ca85; transform: scale(0.97); }
        .btn-outline {
            background: transparent;
            border: 1px solid #e4b363;
            color: #e4b363;
        }
        .btn-outline:hover { background: #e4b36320; transform: none; }
        .delete-btn { background: #b91c1c; color: white; }
        .delete-btn:hover { background: #e02b2b; }
        .edit-btn { background: #2d5f7e; color: white; }
        .edit-btn:hover { background: #3e7b9e; }
        .logout-btn {
            background: #4b446b;
            padding: 8px 22px;
            border-radius: 3rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }
        .movie-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.8rem;
        }
        .movie-card {
            background: #231f39;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 0.8rem 1.2rem;
            transition: all 0.2s;
            border: 1px solid #2f2b4a;
        }
        .movie-card:hover {
            background: #2a2547;
            border-color: #e4b36360;
            transform: translateX(5px);
        }
        .movie-poster-sm {
            width: 60px;
            height: 85px;
            object-fit: cover;
            border-radius: 12px;
            background: #0c0b14;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .movie-info {
            flex: 2;
        }
        .movie-title {
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge {
            background: #2f2b45;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: normal;
        }
        .lang-badge {
            background: #4b446b;
            color: #e4b363;
        }
        .year {
            color: #b9b3e6;
            font-size: 0.85rem;
        }
        .servers-count {
            font-size: 0.7rem;
            color: #aaa;
        }
        .movie-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        button.small {
            padding: 6px 16px;
            font-size: 0.8rem;
        }
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .edit-mode-badge {
            background: #e4b36320;
            color: #e4b363;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
        }
        hr {
            border-color: #342e50;
            margin: 1.5rem 0;
        }
        .error-msg, .success-msg {
            padding: 12px;
            border-radius: 3rem;
            margin: 10px 0;
            text-align: center;
        }
        .error-msg { background: #3a1e1e; color: #ffaa9e; }
        .success-msg { background: #1f3a1c; color: #b5e4b0; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        @media (max-width: 720px) {
            .movie-card { flex-wrap: wrap; }
            .movie-poster-sm { width: 50px; height: 70px; }
            .container { padding: 1rem; }
        }
    </style>
    <!-- Firebase SDKs -->
    <script type="module">
        // ======================= 🔥 YOUR FIREBASE CONFIG (already set) =======================
        const firebaseConfig = {
            apiKey: "AIzaSyD6WMZGUS8s1FufWdCefsv-5mAIYhhkKgY",
            authDomain: "moviesite-admin-c178b.firebaseapp.com",
            projectId: "moviesite-admin-c178b",
            storageBucket: "moviesite-admin-c178b.appspot.com",
            messagingSenderId: "275418486999",
            appId: "1:275418486999:web:845bd57e7a014e7393b892"
        };
        // ====================================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, getDocs, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // DOM elements
        const loginSection = document.getElementById('loginSection');
        const adminPanel = document.getElementById('adminPanel');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const addMovieForm = document.getElementById('addMovieForm');
        const moviesContainer = document.getElementById('moviesContainer');
        const loadingSpan = document.getElementById('loadingMovies');
        const formMessage = document.getElementById('formMessage');
        const formTitle = document.getElementById('formTitle');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        
        let currentEditId = null;  // null = add mode, else movie id
        
        // Helper: show message
        function showMessage(msg, isError = false) {
            if (!formMessage) return;
            formMessage.textContent = msg;
            formMessage.className = isError ? 'error-msg' : 'success-msg';
            formMessage.style.display = 'block';
            setTimeout(() => { if (formMessage) formMessage.style.display = 'none'; }, 4000);
        }
        
        // Fetch movies & render beautifully
        async function loadMovies() {
            if (!moviesContainer) return;
            try {
                if (loadingSpan) loadingSpan.style.display = 'inline-block';
                const moviesRef = collection(db, "movies");
                let querySnapshot;
                try {
                    const q = query(moviesRef, orderBy("title_en", "asc"));
                    querySnapshot = await getDocs(q);
                } catch (e) {
                    console.warn("orderBy failed, using unsorted", e);
                    querySnapshot = await getDocs(moviesRef);
                }
                const movies = [];
                querySnapshot.forEach(docSnap => movies.push({ id: docSnap.id, ...docSnap.data() }));
                if (!querySnapshot._query?.orderBy) {
                    movies.sort((a,b) => (a.title_en || '').localeCompare(b.title_en || ''));
                }
                renderMovieList(movies);
            } catch (err) {
                console.error(err);
                moviesContainer.innerHTML = `<div class="error-msg">❌ Failed to load: ${err.message}. Check Firestore rules.</div>`;
            } finally {
                if (loadingSpan) loadingSpan.style.display = 'none';
            }
        }
        
        function renderMovieList(movies) {
            if (!moviesContainer) return;
            if (movies.length === 0) {
                moviesContainer.innerHTML = `<div style="text-align:center; padding:3rem;">📭 No movies yet. Add your first movie above!</div>`;
                return;
            }
            let html = '';
            for (const movie of movies) {
                const serverCount = movie.servers?.length || 0;
                const posterUrl = movie.poster_url || 'https://via.placeholder.com/60x85?text=No+Poster';
                html += `
                    <div class="movie-card" data-id="${movie.id}">
                        <img class="movie-poster-sm" src="${escapeHtml(posterUrl)}" alt="poster" onerror="this.src='https://via.placeholder.com/60x85?text=Error'">
                        <div class="movie-info">
                            <div class="movie-title">
                                ${escapeHtml(movie.title_en || '?')}
                                <span class="badge lang-badge">${escapeHtml(movie.lang || 'both')}</span>
                                <span class="year">📅 ${escapeHtml(movie.year || '—')}</span>
                            </div>
                            <div style="font-size:0.8rem; opacity:0.8;">${escapeHtml(movie.title_ar || '')}</div>
                            <div class="servers-count">🎬 ${serverCount} server(s) · ${movie.servers?.map(s => s.label).join(', ') || 'no servers'}</div>
                        </div>
                        <div class="movie-actions">
                            <button class="edit-btn small" data-id="${movie.id}" data-action="edit">✏️ Edit</button>
                            <button class="delete-btn small" data-id="${movie.id}" data-action="delete">🗑 Delete</button>
                        </div>
                    </div>
                `;
            }
            moviesContainer.innerHTML = html;
            
            // Attach event listeners for edit/delete
            document.querySelectorAll('.edit-btn[data-action="edit"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-id');
                    openEditMode(id);
                });
            });
            document.querySelectorAll('.delete-btn[data-action="delete"]').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = btn.getAttribute('data-id');
                    if (confirm('Permanently delete this movie?')) {
                        await deleteMovie(id);
                    }
                });
            });
        }
        
        async function deleteMovie(movieId) {
            try {
                await deleteDoc(doc(db, "movies", movieId));
                showMessage('✅ Movie deleted', false);
                loadMovies();
                if (currentEditId === movieId) resetToAddMode();
            } catch (err) {
                showMessage(`Delete failed: ${err.message}`, true);
            }
        }
        
        // Edit mode: load movie data into form
        async function openEditMode(movieId) {
            try {
                const docRef = doc(db, "movies", movieId);
                const docSnap = await getDocs(query(collection(db, "movies"))); // alternative: getDoc
                // better: getDoc
                const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                const snapshot = await getDoc(docRef);
                if (!snapshot.exists()) throw new Error("Movie not found");
                const data = snapshot.data();
                currentEditId = movieId;
                // fill form
                document.getElementById('title_en').value = data.title_en || '';
                document.getElementById('title_ar').value = data.title_ar || '';
                document.getElementById('year').value = data.year || '';
                document.getElementById('lang').value = data.lang || 'both';
                document.getElementById('poster_url').value = data.poster_url || '';
                document.getElementById('description_en').value = data.description_en || '';
                document.getElementById('description_ar').value = data.description_ar || '';
                // fill servers (max 3)
                const servers = data.servers || [];
                if (servers[0]) {
                    document.getElementById('server1_url').value = servers[0].url || '';
                    document.getElementById('server1_name').value = servers[0].label || 'Server 1';
                } else {
                    document.getElementById('server1_url').value = '';
                    document.getElementById('server1_name').value = 'Server 1';
                }
                if (servers[1]) {
                    document.getElementById('server2_url').value = servers[1].url || '';
                    document.getElementById('server2_name').value = servers[1].label || 'Server 2';
                } else {
                    document.getElementById('server2_url').value = '';
                    document.getElementById('server2_name').value = '';
                }
                if (servers[2]) {
                    document.getElementById('server3_url').value = servers[2].url || '';
                    document.getElementById('server3_name').value = servers[2].label || 'Server 3';
                } else {
                    document.getElementById('server3_url').value = '';
                    document.getElementById('server3_name').value = '';
                }
                // change UI to edit mode
                formTitle.textContent = '✏️ Edit Movie';
                const submitBtn = addMovieForm.querySelector('button[type="submit"]');
                submitBtn.textContent = '💾 Update Movie';
                cancelEditBtn.style.display = 'inline-block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                showMessage(`Cannot load movie: ${err.message}`, true);
            }
        }
        
        function resetToAddMode() {
            currentEditId = null;
            addMovieForm.reset();
            document.getElementById('server1_label').value = 'Server 1';
            document.getElementById('server2_label').value = '';
            document.getElementById('server3_label').value = '';
            formTitle.textContent = '➕ Add New Movie';
            const submitBtn = addMovieForm.querySelector('button[type="submit"]');
            submitBtn.textContent = '➕ Add Movie to Firebase';
            cancelEditBtn.style.display = 'none';
        }
        
        // Collect servers from form
        function getServersFromForm() {
            const servers = [];
            const s1url = document.getElementById('server1_url').value.trim();
            if (s1url) servers.push({ label: document.getElementById('server1_label').value.trim() || 'Server 1', url: s1url, icon: 'fa-server' });
            const s2url = document.getElementById('server2_url').value.trim();
            if (s2url) servers.push({ label: document.getElementById('server2_label').value.trim() || 'Server 2', url: s2url, icon: 'fa-server' });
            const s3url = document.getElementById('server3_url').value.trim();
            if (s3url) servers.push({ label: document.getElementById('server3_label').value.trim() || 'Server 3', url: s3url, icon: 'fa-server' });
            return servers;
        }
        
        async function handleAddOrUpdate(e) {
            e.preventDefault();
            const title_en = document.getElementById('title_en').value.trim();
            const title_ar = document.getElementById('title_ar').value.trim();
            const year = document.getElementById('year').value.trim();
            const lang = document.getElementById('lang').value;
            const poster_url = document.getElementById('poster_url').value.trim();
            const description_en = document.getElementById('description_en').value.trim();
            const description_ar = document.getElementById('description_ar').value.trim();
            const servers = getServersFromForm();
            
            if (!title_en || !title_ar || !year || !poster_url) {
                showMessage('Please fill all required fields (title, year, poster).', true);
                return;
            }
            if (servers.length === 0) {
                showMessage('At least one server URL is required.', true);
                return;
            }
            const movieData = {
                title_en, title_ar, year, lang, poster_url, description_en, description_ar, servers,
                updatedAt: new Date().toISOString()
            };
            
            try {
                if (currentEditId) {
                    // update existing
                    const docRef = doc(db, "movies", currentEditId);
                    await updateDoc(docRef, movieData);
                    showMessage('✅ Movie updated successfully!', false);
                    resetToAddMode();
                } else {
                    // add new
                    await addDoc(collection(db, "movies"), { ...movieData, createdAt: new Date().toISOString() });
                    showMessage('✅ Movie added successfully!', false);
                    addMovieForm.reset();
                    document.getElementById('server1_label').value = 'Server 1';
                    document.getElementById('server2_label').value = '';
                    document.getElementById('server3_label').value = '';
                }
                await loadMovies();
                if (!currentEditId) addMovieForm.reset();
            } catch (err) {
                showMessage(`Operation failed: ${err.message}`, true);
            }
        }
        
        // auth logic
        async function handleLogin(email, password) {
            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginError.style.display = 'none';
            } catch (err) {
                loginError.textContent = '❌ ' + err.message;
                loginError.style.display = 'block';
            }
        }
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = 'none';
                adminPanel.style.display = 'block';
                loadMovies();
                resetToAddMode();
            } else {
                loginSection.style.display = 'block';
                adminPanel.style.display = 'none';
                if (moviesContainer) moviesContainer.innerHTML = '';
                resetToAddMode();
            }
        });
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const pwd = document.getElementById('adminPassword').value;
            handleLogin(email, pwd);
        });
        logoutBtn.addEventListener('click', () => signOut(auth));
        addMovieForm.addEventListener('submit', handleAddOrUpdate);
        cancelEditBtn.addEventListener('click', resetToAddMode);
        
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
        
        // initial reset
        resetToAddMode();
    </script>
</head>
<body>
<div id="loginSection" style="display:block;">
    <div class="login-box">
        <h2>🎬 Admin Login</h2>
        <p>Firebase Email/Password</p>
        <form id="loginForm">
            <input type="email" id="adminEmail" placeholder="Admin Email" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit" style="width:100%;">🔑 Login</button>
            <div id="loginError" class="error-msg" style="display:none; margin-top:1rem;"></div>
        </form>
        <hr>
        <small>Make sure you created an admin user in Firebase Auth.</small>
    </div>
</div>

<div id="adminPanel" style="display:none;">
    <div class="container">
        <div class="flex-between">
            <h1>🎬 BadiniMovies · Admin Panel </h1>
            <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
        </div>
        <div style="margin-top: 2rem;">
            <div class="form-header">
                <h2 id="formTitle">➕ Add New Movie</h2>
                <button type="button" id="cancelEditBtn" style="display:none;" class="btn-outline">✖ Cancel Edit</button>
            </div>
            <form id="addMovieForm">
                <input type="text" id="title_en" placeholder="Title (English) *" required>
                <input type="text" id="title_ar" placeholder="Title (Arabic) *" required>
                <input type="text" id="year" placeholder="Year *" required>
                <select id="lang"><option value="both">Both</option><option value="en">English</option><option value="ar">Arabic</option></select>
                <input type="url" id="poster_url" placeholder="Poster URL *" required>
                <textarea id="description_en" rows="2" placeholder="Description (English)"></textarea>
                <textarea id="description_ar" rows="2" placeholder="Description (Arabic)"></textarea>
                <h3>🌐 Servers (at least one)</h3>
                <div style="background:#231f39; padding:1rem; border-radius:1.5rem;">
                    <input type="url" id="server1_url" placeholder="Server 1 URL *" required>
                    <input type="text" id="server1_label" placeholder="Label" value="Server 1">
                    <input type="url" id="server2_url" placeholder="Server 2 URL">
                    <input type="text" id="server2_label" placeholder="Label">
                    <input type="url" id="server3_url" placeholder="Server 3 URL">
                    <input type="text" id="server3_label" placeholder="Label">
                </div>
                <button type="submit">➕ Add Movie to Firebase</button>
                <div id="formMessage" style="display:none; margin-top: 1rem;"></div>
            </form>
        </div>
        <hr>
        <div class="flex-between">
            <h2>📋 Movie Collection <span id="loadingMovies" style="font-size:0.8rem; display:none;">🔄 loading...</span></h2>
        </div>
        <div id="moviesContainer" class="movie-grid">
            <div style="text-align:center;">Loading movies...</div>
        </div>
        <div style="margin-top: 2rem; font-size:0.7rem; text-align:center; opacity:0.6;">✅ Edit any movie — click ✏️ Edit, modify, then Update</div>
    </div>
</div>
</body>
</html>
