<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadiniMovies – Admin Panel </title>
    <!-- Firebase SDKs -->
    <script type="module">
        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyD6WMZGUS8s1FufWdCefsv-5mAIYhhkKgY",
            authDomain: "moviesite-admin-c178b.firebaseapp.com",
            projectId: "moviesite-admin-c178b",
            storageBucket: "moviesite-admin-c178b.appspot.com",
            messagingSenderId: "275418486999",
            appId: "1:275418486999:web:845bd57e7a014e7393b892"
        };
        // =====================================

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM elements
        const loginDiv = document.getElementById('loginDiv');
        const adminDiv = document.getElementById('adminDiv');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const movieListContainer = document.getElementById('movieList');
        const addMovieForm = document.getElementById('addMovieForm');
        
        // Edit section elements
        const editPanel = document.getElementById('editMoviePanel');
        const editForm = document.getElementById('editMovieForm');
        const editCancelBtn = document.getElementById('editCancelBtn');
        const editDocIdField = document.getElementById('editDocId');
        
        // Pagination elements
        const paginationControls = document.getElementById('paginationControls');

        // ---------- GLOBAL STATE ----------
        let allMovies = [];           // array of { id, ...data, sortTimestamp }
        let currentPage = 1;
        const ITEMS_PER_PAGE = 10;
        let currentEditId = null;

        // Helper: escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        // ---------- SORT: NEWEST TO OLDEST (by upload time) ----------
        // Uses serverTimestamp (createdAt) if exists, otherwise falls back to custom "id" field (Date.now() string) numeric value
        // Returns sorted array with most recent first.
        function sortMoviesNewestToOldest(moviesArray) {
            return [...moviesArray].sort((a, b) => {
                let timeA = 0, timeB = 0;
                // get createdAt timestamp (seconds) from Firestore Timestamp
                if (a.createdAt && a.createdAt.seconds) {
                    timeA = a.createdAt.seconds * 1000;
                } else if (a.idNumFallback) {
                    timeA = a.idNumFallback;
                } else if (a.customIdNum) {
                    timeA = a.customIdNum;
                }
                
                if (b.createdAt && b.createdAt.seconds) {
                    timeB = b.createdAt.seconds * 1000;
                } else if (b.idNumFallback) {
                    timeB = b.idNumFallback;
                } else if (b.customIdNum) {
                    timeB = b.customIdNum;
                }
                // NEWEST FIRST: larger timestamp comes first
                return timeB - timeA;
            });
        }

        // Render current page movies + pagination buttons
        function renderMoviesList() {
            if (!allMovies.length) {
                movieListContainer.innerHTML = '<p class="empty-movies">✨ No movies yet. Add your first movie below.</p>';
                paginationControls.innerHTML = '';
                return;
            }
            
            const sortedMovies = sortMoviesNewestToOldest(allMovies);
            const totalPages = Math.ceil(sortedMovies.length / ITEMS_PER_PAGE);
            // adjust current page if out of range
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            
            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIdx = startIdx + ITEMS_PER_PAGE;
            const pageMovies = sortedMovies.slice(startIdx, endIdx);
            
            let tableHtml = `<table class="movies-table">
                                <thead>
                                    <tr><th>🎬 Movie Info</th><th style="width:140px">Actions</th></tr>
                                </thead>
                                <tbody>`;
            for (const movie of pageMovies) {
                const yearDisplay = movie.year || '—';
                const langDisplay = movie.lang || 'both';
                const titleEn = escapeHtml(movie.titleEn) || 'Untitled';
                const titleAr = escapeHtml(movie.titleAr) || '';
                // optional: show upload time hint (just for clarity)
                let uploadHint = '';
                if (movie.createdAt && movie.createdAt.seconds) {
                    const date = new Date(movie.createdAt.seconds * 1000);
                    uploadHint = `<span style="font-size:11px; opacity:0.6;"> 📅 ${date.toLocaleDateString()}</span>`;
                }
                tableHtml += `<tr>
                                <td class="movie-info-cell">
                                    <strong>${titleEn}</strong> ${titleAr ? `<span dir="rtl">(${titleAr})</span>` : ''}<br>
                                    <small>📅 ${yearDisplay} | 🌐 ${langDisplay}${uploadHint}</small>
                                    ${movie.posterUrl ? `<div><small>🖼️ Poster available</small></div>` : ''}
                                </td>
                                <td class="action-buttons">
                                    <button class="delete-btn" data-id="${movie.id}">🗑️ Delete</button>
                                    <button class="edit-btn" data-id="${movie.id}">✏️ Edit</button>
                                </td>
                              </td>`;
            }
            tableHtml += `</tbody>`;
            tableHtml += `</table>`;
            movieListContainer.innerHTML = tableHtml;
            
            // attach event listeners to dynamically created buttons
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const movieId = btn.getAttribute('data-id');
                    deleteMovieById(movieId);
                });
            });
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const movieId = btn.getAttribute('data-id');
                    openEditPanel(movieId);
                });
            });
            
            // render pagination
            renderPagination(totalPages);
        }
        
        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                paginationControls.innerHTML = '';
                return;
            }
            let paginationHtml = `<div class="pagination-wrapper">
                                    <button class="page-btn" id="prevPageBtn" ${currentPage === 1 ? 'disabled' : ''}>◀ Previous</button>
                                    <span class="page-indicator">Page ${currentPage} of ${totalPages}</span>
                                    <button class="page-btn" id="nextPageBtn" ${currentPage === totalPages ? 'disabled' : ''}>Next ▶</button>
                                  </div>`;
            paginationControls.innerHTML = paginationHtml;
            
            document.getElementById('prevPageBtn')?.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderMoviesList();
                }
            });
            document.getElementById('nextPageBtn')?.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderMoviesList();
                }
            });
        }
        
        // Load all movies from Firestore and assign sort timestamps
        async function loadMovies() {
            movieListContainer.innerHTML = '<div class="loading">🎞️ Loading movies...</div>';
            try {
                const moviesRef = collection(db, "movies");
                const querySnapshot = await getDocs(moviesRef);
                const moviesArray = [];
                for (const docSnap of querySnapshot.docs) {
                    const data = docSnap.data();
                    let createdAtMs = null;
                    if (data.createdAt && data.createdAt.seconds) {
                        createdAtMs = data.createdAt.seconds * 1000;
                    }
                    // fallback: custom "id" field (string timestamp from Date.now)
                    let fallbackNumeric = 0;
                    if (data.id && !isNaN(parseInt(data.id))) {
                        fallbackNumeric = parseInt(data.id);
                    } else if (data.id && typeof data.id === 'string') {
                        const parsed = parseInt(data.id);
                        if (!isNaN(parsed)) fallbackNumeric = parsed;
                    }
                    moviesArray.push({
                        id: docSnap.id,
                        ...data,
                        _createdAtMs: createdAtMs,
                        _fallbackNumeric: fallbackNumeric,
                        customIdNum: fallbackNumeric,
                    });
                }
                // Compute numeric timestamp for sorting: use createdAt else fallback id numeric
                allMovies = moviesArray.map(m => {
                    let sortTime = m._createdAtMs ? m._createdAtMs : (m._fallbackNumeric || 0);
                    return { ...m, sortTimestamp: sortTime };
                });
                // reset page to 1 after fresh load
                currentPage = 1;
                renderMoviesList();
            } catch (error) {
                console.error("Load error:", error);
                movieListContainer.innerHTML = '<p class="error">❌ Failed to load movies. Check console.</p>';
            }
        }
        
        // Delete movie
        window.deleteMovieById = async (movieId) => {
            if (!confirm("⚠️ Delete this movie permanently? This action cannot be undone.")) return;
            try {
                await deleteDoc(doc(db, "movies", movieId));
                await loadMovies();
            } catch (err) {
                alert("Delete failed: " + err.message);
            }
        };
        
        // ------------------- EDIT PANEL LOGIC -------------------
        function openEditPanel(movieId) {
            const movie = allMovies.find(m => m.id === movieId);
            if (!movie) {
                alert("Movie not found");
                return;
            }
            currentEditId = movieId;
            editDocIdField.value = movieId;
            
            // Fill basic fields
            document.getElementById('edit_titleEn').value = movie.titleEn || '';
            document.getElementById('edit_titleAr').value = movie.titleAr || '';
            document.getElementById('edit_year').value = movie.year || '';
            document.getElementById('edit_lang').value = movie.lang || 'both';
            document.getElementById('edit_posterUrl').value = movie.posterUrl || '';
            document.getElementById('edit_description').value = movie.description || '';
            document.getElementById('edit_descriptionAr').value = movie.descriptionAr || '';
            
            // Handle servers array (max 3 servers for simplicity)
            const servers = movie.servers || [];
            // Server 1
            const server1 = servers[0] || { label: "Vidspeeds", url: "", icon: "fa-server" };
            document.getElementById('edit_server1_url').value = server1.url || '';
            document.getElementById('edit_server1_label').value = server1.label || "Vidspeeds";
            // Server 2
            const server2 = servers[1] || { label: "Vidroba", url: "", icon: "fa-server" };
            document.getElementById('edit_server2_url').value = server2.url || '';
            document.getElementById('edit_server2_label').value = server2.label || "Vidroba";
            // Server 3
            const server3 = servers[2] || { label: "Upload", url: "", icon: "fa-server" };
            document.getElementById('edit_server3_url').value = server3.url || '';
            document.getElementById('edit_server3_label').value = server3.label || "Upload";
            
            editPanel.style.display = 'block';
            // smooth scroll to edit panel
            editPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // Close edit panel
        function closeEditPanel() {
            editPanel.style.display = 'none';
            editForm.reset();
            currentEditId = null;
            editDocIdField.value = '';
        }
        
        // Save edited movie (preserves original createdAt)
        async function saveEditedMovie(event) {
            event.preventDefault();
            const docId = editDocIdField.value;
            if (!docId) {
                alert("No movie selected for editing.");
                return;
            }
            
            // Build servers array from edit form (supports custom labels & URLs)
            const server1url = document.getElementById('edit_server1_url').value.trim();
            const server1label = document.getElementById('edit_server1_label').value.trim() || "Vidspeeds";
            const server2url = document.getElementById('edit_server2_url').value.trim();
            const server2label = document.getElementById('edit_server2_label').value.trim() || "Vidroba";
            const server3url = document.getElementById('edit_server3_url').value.trim();
            const server3label = document.getElementById('edit_server3_label').value.trim() || "Upload";
            
            const newServers = [];
            if (server1url) newServers.push({ label: server1label, url: server1url, icon: "fa-server" });
            if (server2url) newServers.push({ label: server2label, url: server2url, icon: "fa-server" });
            if (server3url) newServers.push({ label: server3label, url: server3url, icon: "fa-server" });
            
            // At least one server required
            if (newServers.length === 0) {
                alert("Please provide at least one video server URL.");
                return;
            }
            
            const updatedData = {
                titleEn: document.getElementById('edit_titleEn').value,
                titleAr: document.getElementById('edit_titleAr').value,
                year: document.getElementById('edit_year').value,
                lang: document.getElementById('edit_lang').value,
                posterUrl: document.getElementById('edit_posterUrl').value,
                description: document.getElementById('edit_description').value,
                descriptionAr: document.getElementById('edit_descriptionAr').value,
                servers: newServers,
                // Keep original id field for fallback sorting compatibility
                id: (allMovies.find(m => m.id === docId)?.id) || Date.now().toString()
            };
            
            try {
                const movieRef = doc(db, "movies", docId);
                await updateDoc(movieRef, updatedData);
                alert("✅ Movie updated successfully!");
                closeEditPanel();
                await loadMovies();   // refresh list with pagination & newest-first sort
            } catch (err) {
                console.error(err);
                alert("Update failed: " + err.message);
            }
        }
        
        // ------------------- ADD MOVIE (with serverTimestamp for correct newest-first order) -------------------
        addMovieForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const server1 = document.getElementById('server1').value.trim();
            if (!server1) {
                alert("Please provide at least Server 1 URL.");
                return;
            }
            
            const server2Url = document.getElementById('server2').value.trim();
            const server3Url = document.getElementById('server3').value.trim();
            
            const serversArray = [];
            serversArray.push({ label: "Vidspeeds", url: server1, icon: "fa-server" });
            if (server2Url) serversArray.push({ label: "Vidroba", url: server2Url, icon: "fa-server" });
            if (server3Url) serversArray.push({ label: "Upload", url: server3Url, icon: "fa-server" });
            
            const newMovie = {
                id: Date.now().toString(),      // legacy + fallback for sorting (if needed)
                titleEn: document.getElementById('titleEn').value,
                titleAr: document.getElementById('titleAr').value,
                year: document.getElementById('year').value,
                lang: document.getElementById('lang').value,
                posterUrl: document.getElementById('posterUrl').value,
                description: document.getElementById('description').value,
                descriptionAr: document.getElementById('descriptionAr').value,
                servers: serversArray,
                createdAt: serverTimestamp()    // ← FIREBASE TIMESTAMP: newest first sorting
            };
            
            try {
                await addDoc(collection(db, "movies"), newMovie);
                alert("🎉 Movie added successfully! (Newest movies appear first)");
                addMovieForm.reset();
                await loadMovies();    // reload with newest-first order
            } catch (error) {
                alert("Error adding movie: " + error.message);
            }
        });
        
        // Auth state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginDiv.style.display = 'none';
                adminDiv.style.display = 'block';
                loadMovies();
                // close edit panel on login
                closeEditPanel();
            } else {
                loginDiv.style.display = 'block';
                adminDiv.style.display = 'none';
                allMovies = [];
                currentPage = 1;
                movieListContainer.innerHTML = '';
            }
        });
        
        // Login
        loginBtn.addEventListener('click', () => {
            const email = loginEmail.value.trim();
            const pass = loginPassword.value.trim();
            if (!email || !pass) {
                alert("Enter email and password");
                return;
            }
            signInWithEmailAndPassword(auth, email, pass)
                .then(() => { loginEmail.value = ''; loginPassword.value = ''; })
                .catch(err => alert("Login failed: " + err.message));
        });
        
        logoutBtn.addEventListener('click', () => signOut(auth));
        
        // Edit Panel Close & Cancel
        editCancelBtn.addEventListener('click', closeEditPanel);
        editForm.addEventListener('submit', saveEditedMovie);
        
        // optional click outside behavior (just for convenience)
        window.addEventListener('click', (e) => {
            if (editPanel.style.display === 'block' && !editPanel.contains(e.target) && !e.target.closest('.edit-btn')) {
                // Optional: do not auto-close to avoid accidental loss, but cancel button exists.
            }
        });
    </script>

<body>
<div class="container">
    <h1>🎬 BadiniMovies – Admin Panel</h1>

    <!-- Login Section -->
    <div id="loginDiv">
        <h2>🔐 Admin Login</h2>
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="off">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Sign In</button>
    </div>

    <!-- Admin Section (visible after login) -->
    <div id="adminDiv">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
            <h2>📋 Movie Management</h2>
            <button id="logoutBtn" style="width:auto; background:#4b446b;">🚪 Logout</button>
        </div>

        <!-- Movie List + Pagination -->
        <div id="movieList">Loading movies...</div>
        <div id="paginationControls" class="pagination-wrapper"></div>

        <!-- EDIT MOVIE PANEL (hidden initially) -->
        <div id="editMoviePanel" class="edit-panel">
            <h3>✏️ Edit Movie <span style="font-size:0.8rem;">(update fields)</span></h3>
            <form id="editMovieForm">
                <input type="hidden" id="editDocId">
                <div class="form-row">
                    <div><input type="text" id="edit_titleEn" placeholder="Title (English)" required></div>
                    <div><input type="text" id="edit_titleAr" placeholder="Title (Arabic)" required></div>
                </div>
                <div class="form-row">
                    <div><input type="text" id="edit_year" placeholder="Year (e.g. 2025)" required></div>
                    <div>
                        <select id="edit_lang" required>
                            <option value="both">Both (EN/AR)</option>
                            <option value="en">English only</option>
                            <option value="ar">Arabic only</option>
                        </select>
                    </div>
                </div>
                <input type="url" id="edit_posterUrl" placeholder="Poster image URL" required>
                <textarea id="edit_description" rows="2" placeholder="Description (English)" required></textarea>
                <textarea id="edit_descriptionAr" rows="2" placeholder="Description (Arabic)" required></textarea>
                
                <h4>🎞️ Video Servers (custom labels & URLs)</h4>
                <div class="server-group">
                    <label>🔹 Server 1 (Vidspeeds style)</label>
                    <input type="text" id="edit_server1_label" placeholder="Label e.g. Vidspeeds">
                    <input type="url" id="edit_server1_url" placeholder="Server 1 URL">
                </div>
                <div class="server-group">
                    <label>🔸 Server 2 (Vidroba style)</label>
                    <input type="text" id="edit_server2_label" placeholder="Label e.g. Vidroba">
                    <input type="url" id="edit_server2_url" placeholder="Server 2 URL">
                </div>
                <div class="server-group">
                    <label>🔹 Server 3 (Upload / extra)</label>
                    <input type="text" id="edit_server3_label" placeholder="Label e.g. Upload">
                    <input type="url" id="edit_server3_url" placeholder="Server 3 URL (optional)">
                </div>
                <div class="flex-buttons">
                    <button type="submit">💾 Save Changes</button>
                    <button type="button" id="editCancelBtn" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>

        <hr>
        <h2>➕ Add New Movie</h2>
        <form id="addMovieForm">
            <div class="form-row">
                <div><input type="text" id="titleEn" placeholder="Title (English)" required></div>
                <div><input type="text" id="titleAr" placeholder="Title (Arabic)" required></div>
            </div>
            <div class="form-row">
                <div><input type="text" id="year" placeholder="Year (e.g. 2025)" required></div>
                <div>
                    <select id="lang" required>
                        <option value="both">Both (EN/AR)</option>
                        <option value="en">English only</option>
                        <option value="ar">Arabic only</option>
                    </select>
                </div>
            </div>
            <input type="url" id="posterUrl" placeholder="Poster image URL" required>
            <textarea id="description" rows="2" placeholder="Description (English)" required></textarea>
            <textarea id="descriptionAr" rows="2" placeholder="Description (Arabic)" required></textarea>
            <h3>📡 Video Servers (first is required)</h3>
            <input type="url" id="server1" placeholder="Server 1 URL (Vidspeeds, etc.)" required>
            <input type="url" id="server2" placeholder="Server 2 URL (Vidroba)">
            <input type="url" id="server3" placeholder="Server 3 URL (optional)">
            <button type="submit">➕ Add Movie (Newest to Oldest)</button>
        </form>
        <div class="hint">
            ✅ <strong>Sorted: Newest to Oldest</strong> 
        </div>
    </div>
</div>
</body>
</html>
