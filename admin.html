<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadiniMovies – Admin Panel | Fixed Edit/Delete</title>
    <!-- Firebase SDKs -->
    <script type="module">
        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyD6WMZGUS8s1FufWdCefsv-5mAIYhhkKgY",
            authDomain: "moviesite-admin-c178b.firebaseapp.com",
            projectId: "moviesite-admin-c178b",
            storageBucket: "moviesite-admin-c178b.appspot.com",
            messagingSenderId: "275418486999",
            appId: "1:275418486999:web:845bd57e7a014e7393b892"
        };
        // =====================================

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM elements
        const loginDiv = document.getElementById('loginDiv');
        const adminDiv = document.getElementById('adminDiv');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const movieListContainer = document.getElementById('movieList');
        const addMovieForm = document.getElementById('addMovieForm');
        
        // Edit section elements
        const editPanel = document.getElementById('editMoviePanel');
        const editForm = document.getElementById('editMovieForm');
        const editCancelBtn = document.getElementById('editCancelBtn');
        const editDocIdField = document.getElementById('editDocId');
        
        // Pagination elements
        const paginationControls = document.getElementById('paginationControls');

        // ---------- GLOBAL STATE ----------
        let allMovies = [];           // each item: { docId, customId, ...data, sortTimestamp }
        let currentPage = 1;
        const ITEMS_PER_PAGE = 10;

        // Helper: escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        // ---------- SORT: NEWEST TO OLDEST (by upload time) ----------
        function sortMoviesNewestToOldest(moviesArray) {
            return [...moviesArray].sort((a, b) => {
                let timeA = a.sortTimestamp || 0;
                let timeB = b.sortTimestamp || 0;
                return timeB - timeA; // newest first
            });
        }

        // Render current page movies + pagination
        function renderMoviesList() {
            if (!allMovies.length) {
                movieListContainer.innerHTML = '<p class="empty-movies">✨ No movies yet. Add your first movie below.</p>';
                paginationControls.innerHTML = '';
                return;
            }
            
            const sortedMovies = sortMoviesNewestToOldest(allMovies);
            const totalPages = Math.ceil(sortedMovies.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            
            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIdx = startIdx + ITEMS_PER_PAGE;
            const pageMovies = sortedMovies.slice(startIdx, endIdx);
            
            let tableHtml = `<table class="movies-table">
                                <thead><tr><th>🎬 Movie Info</th><th style="width:140px">Actions</th></tr></thead>
                                <tbody>`;
            for (const movie of pageMovies) {
                const yearDisplay = movie.year || '—';
                const langDisplay = movie.lang || 'both';
                const titleEn = escapeHtml(movie.titleEn) || 'Untitled';
                const titleAr = escapeHtml(movie.titleAr) || '';
                let uploadHint = '';
                if (movie.createdAt && movie.createdAt.seconds) {
                    const date = new Date(movie.createdAt.seconds * 1000);
                    uploadHint = `<span style="font-size:11px; opacity:0.6;"> 📅 ${date.toLocaleDateString()}</span>`;
                }
                tableHtml += `<tr>
                                <td class="movie-info-cell">
                                    <strong>${titleEn}</strong> ${titleAr ? `<span dir="rtl">(${titleAr})</span>` : ''}<br>
                                    <small>📅 ${yearDisplay} | 🌐 ${langDisplay}${uploadHint}</small>
                                    ${movie.posterUrl ? `<div><small>🖼️ Poster available</small></div>` : ''}
                                 </td>
                                <td class="action-buttons">
                                    <button class="delete-btn" data-docid="${movie.docId}">🗑️ Delete</button>
                                    <button class="edit-btn" data-docid="${movie.docId}">✏️ Edit</button>
                                 </td>
                               </tr>`;
            }
            tableHtml += `</tbody></table>`;
            movieListContainer.innerHTML = tableHtml;
            
            // Attach event listeners using the Firestore docId
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteMovieById(btn.getAttribute('data-docid')));
            });
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => openEditPanel(btn.getAttribute('data-docid')));
            });
            
            renderPagination(totalPages);
        }
        
        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                paginationControls.innerHTML = '';
                return;
            }
            paginationControls.innerHTML = `<div class="pagination-wrapper">
                                    <button class="page-btn" id="prevPageBtn" ${currentPage === 1 ? 'disabled' : ''}>◀ Previous</button>
                                    <span class="page-indicator">Page ${currentPage} of ${totalPages}</span>
                                    <button class="page-btn" id="nextPageBtn" ${currentPage === totalPages ? 'disabled' : ''}>Next ▶</button>
                                  </div>`;
            document.getElementById('prevPageBtn')?.addEventListener('click', () => {
                if (currentPage > 1) { currentPage--; renderMoviesList(); }
            });
            document.getElementById('nextPageBtn')?.addEventListener('click', () => {
                if (currentPage < totalPages) { currentPage++; renderMoviesList(); }
            });
        }
        
        // Load movies from Firestore – separate Firestore docId from custom 'id' field
        async function loadMovies() {
            movieListContainer.innerHTML = '<div class="loading">🎞️ Loading movies...</div>';
            try {
                const querySnapshot = await getDocs(collection(db, "movies"));
                const moviesArray = [];
                for (const docSnap of querySnapshot.docs) {
                    const data = docSnap.data();
                    // Determine sort timestamp: prefer createdAt (Firestore Timestamp), fallback to custom 'id' number
                    let sortTime = 0;
                    if (data.createdAt && data.createdAt.seconds) {
                        sortTime = data.createdAt.seconds * 1000;
                    } else if (data.id && !isNaN(parseInt(data.id))) {
                        sortTime = parseInt(data.id);
                    }
                    moviesArray.push({
                        docId: docSnap.id,               // Firestore document ID – used for updates/deletes
                        customId: data.id || null,       // legacy custom id (for sorting fallback only)
                        ...data,
                        sortTimestamp: sortTime
                    });
                }
                allMovies = moviesArray;
                currentPage = 1;
                renderMoviesList();
            } catch (error) {
                console.error(error);
                movieListContainer.innerHTML = '<p class="error">❌ Failed to load movies.</p>';
            }
        }
        
        // Delete using Firestore docId
        async function deleteMovieById(docId) {
            if (!confirm("⚠️ Delete this movie permanently?")) return;
            try {
                await deleteDoc(doc(db, "movies", docId));
                await loadMovies();
            } catch (err) {
                alert("Delete failed: " + err.message);
            }
        }
        
        // ------------------- EDIT PANEL -------------------
        function openEditPanel(docId) {
            const movie = allMovies.find(m => m.docId === docId);
            if (!movie) {
                alert("Movie not found");
                return;
            }
            editDocIdField.value = docId;
            document.getElementById('edit_titleEn').value = movie.titleEn || '';
            document.getElementById('edit_titleAr').value = movie.titleAr || '';
            document.getElementById('edit_year').value = movie.year || '';
            document.getElementById('edit_lang').value = movie.lang || 'both';
            document.getElementById('edit_posterUrl').value = movie.posterUrl || '';
            document.getElementById('edit_description').value = movie.description || '';
            document.getElementById('edit_descriptionAr').value = movie.descriptionAr || '';
            
            const servers = movie.servers || [];
            const s1 = servers[0] || { label: "Vidspeeds", url: "" };
            const s2 = servers[1] || { label: "Vidroba", url: "" };
            const s3 = servers[2] || { label: "Upload", url: "" };
            document.getElementById('edit_server1_label').value = s1.label;
            document.getElementById('edit_server1_url').value = s1.url;
            document.getElementById('edit_server2_label').value = s2.label;
            document.getElementById('edit_server2_url').value = s2.url;
            document.getElementById('edit_server3_label').value = s3.label;
            document.getElementById('edit_server3_url').value = s3.url;
            
            editPanel.style.display = 'block';
            editPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        function closeEditPanel() {
            editPanel.style.display = 'none';
            editForm.reset();
            editDocIdField.value = '';
        }
        
        async function saveEditedMovie(event) {
            event.preventDefault();
            const docId = editDocIdField.value;
            if (!docId) return alert("No document ID");
            
            const server1url = document.getElementById('edit_server1_url').value.trim();
            if (!server1url) return alert("Server 1 URL is required");
            
            const newServers = [];
            newServers.push({ label: document.getElementById('edit_server1_label').value.trim() || "Vidspeeds", url: server1url, icon: "fa-server" });
            const s2url = document.getElementById('edit_server2_url').value.trim();
            if (s2url) newServers.push({ label: document.getElementById('edit_server2_label').value.trim() || "Vidroba", url: s2url, icon: "fa-server" });
            const s3url = document.getElementById('edit_server3_url').value.trim();
            if (s3url) newServers.push({ label: document.getElementById('edit_server3_label').value.trim() || "Upload", url: s3url, icon: "fa-server" });
            
            const updatedData = {
                titleEn: document.getElementById('edit_titleEn').value,
                titleAr: document.getElementById('edit_titleAr').value,
                year: document.getElementById('edit_year').value,
                lang: document.getElementById('edit_lang').value,
                posterUrl: document.getElementById('edit_posterUrl').value,
                description: document.getElementById('edit_description').value,
                descriptionAr: document.getElementById('edit_descriptionAr').value,
                servers: newServers,
                id: (allMovies.find(m => m.docId === docId)?.customId) || Date.now().toString()
            };
            
            try {
                await updateDoc(doc(db, "movies", docId), updatedData);
                alert("✅ Movie updated!");
                closeEditPanel();
                await loadMovies();
            } catch (err) {
                alert("Update failed: " + err.message);
            }
        }
        
        // ------------------- ADD MOVIE -------------------
        addMovieForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const server1 = document.getElementById('server1').value.trim();
            if (!server1) return alert("Server 1 URL is required");
            
            const serversArray = [{ label: "Vidspeeds", url: server1, icon: "fa-server" }];
            const s2 = document.getElementById('server2').value.trim();
            if (s2) serversArray.push({ label: "Vidroba", url: s2, icon: "fa-server" });
            const s3 = document.getElementById('server3').value.trim();
            if (s3) serversArray.push({ label: "Upload", url: s3, icon: "fa-server" });
            
            const newMovie = {
                id: Date.now().toString(),
                titleEn: document.getElementById('titleEn').value,
                titleAr: document.getElementById('titleAr').value,
                year: document.getElementById('year').value,
                lang: document.getElementById('lang').value,
                posterUrl: document.getElementById('posterUrl').value,
                description: document.getElementById('description').value,
                descriptionAr: document.getElementById('descriptionAr').value,
                servers: serversArray,
                createdAt: serverTimestamp()
            };
            
            try {
                await addDoc(collection(db, "movies"), newMovie);
                alert("🎉 Movie added! (Newest first)");
                addMovieForm.reset();
                await loadMovies();
            } catch (error) {
                alert("Add error: " + error.message);
            }
        });
        
        // ------------------- AUTH -------------------
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginDiv.style.display = 'none';
                adminDiv.style.display = 'block';
                loadMovies();
                closeEditPanel();
            } else {
                loginDiv.style.display = 'block';
                adminDiv.style.display = 'none';
                allMovies = [];
            }
        });
        
        loginBtn.addEventListener('click', () => {
            signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value)
                .then(() => { loginEmail.value = ''; loginPassword.value = ''; })
                .catch(err => alert("Login failed: " + err.message));
        });
        logoutBtn.addEventListener('click', () => signOut(auth));
        editCancelBtn.addEventListener('click', closeEditPanel);
        editForm.addEventListener('submit', saveEditedMovie);
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, Arial, sans-serif; background: #0c0b14; color: #f0eef7; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: #1a1728; padding: 24px; border-radius: 32px; box-shadow: 0 20px 35px rgba(0,0,0,0.5); }
        input, textarea, select, button { margin: 8px 0; padding: 12px 14px; border-radius: 16px; border: none; font-size: 0.95rem; }
        input, textarea, select { background: #2f2b45; color: white; border: 1px solid #4b4570; }
        button { background: #e4b363; color: #12101c; font-weight: bold; cursor: pointer; }
        button:hover { background: #f7c97a; transform: scale(0.98); }
        .delete-btn { background: #aa3e3e; color: white; margin-right: 8px; }
        .edit-btn { background: #3a6ea5; color: white; }
        #loginDiv, #adminDiv { display: none; }
        .movies-table { width: 100%; background: #2f2b45; border-radius: 24px; border-collapse: collapse; margin: 20px 0; }
        .movies-table th, .movies-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #4a4368; }
        .movies-table th { background: #211d33; color: #e4b363; }
        .action-buttons button { padding: 8px 14px; border-radius: 40px; width: auto; margin: 0 4px; }
        .pagination-wrapper { display: flex; justify-content: center; gap: 20px; margin: 25px 0 10px; }
        .page-btn { background: #3a3760; color: #f0eef7; padding: 8px 20px; border-radius: 40px; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-indicator { background: #2f2b45; padding: 6px 18px; border-radius: 40px; }
        .edit-panel { background: #231f37; border-radius: 28px; padding: 20px 25px; margin: 20px 0; border-left: 6px solid #e4b363; display: none; }
        .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .form-row > div { flex: 1; min-width: 200px; }
        .server-group { background: #1e1b2e; padding: 12px 15px; border-radius: 20px; margin-bottom: 12px; }
        .server-group label { font-weight: 600; color: #e4b363; }
        .flex-buttons { display: flex; gap: 12px; margin-top: 10px; }
        .cancel-btn { background: #5b547b; color: white; }
        .hint { font-size: 12px; margin-top: 12px; opacity: 0.7; background: #2f2b45; padding: 10px; border-radius: 20px; text-align: center; }
        @media (max-width: 700px) { .action-buttons { display: flex; flex-direction: column; gap: 8px; } .action-buttons button { width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 BadiniMovies – Admin Panel</h1>
    <div id="loginDiv">
        <h2>🔐 Admin Login</h2>
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="off">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Sign In</button>
    </div>
    <div id="adminDiv">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
            <h2>📋 Movie Management</h2>
            <button id="logoutBtn" style="width:auto; background:#4b446b;">🚪 Logout</button>
        </div>
        <div id="movieList">Loading movies...</div>
        <div id="paginationControls"></div>

        <div id="editMoviePanel" class="edit-panel">
            <h3>✏️ Edit Movie</h3>
            <form id="editMovieForm">
                <input type="hidden" id="editDocId">
                <div class="form-row">
                    <div><input type="text" id="edit_titleEn" placeholder="Title (English)" required></div>
                    <div><input type="text" id="edit_titleAr" placeholder="Title (Arabic)" required></div>
                </div>
                <div class="form-row">
                    <div><input type="text" id="edit_year" placeholder="Year" required></div>
                    <div><select id="edit_lang" required><option value="both">Both</option><option value="en">English</option><option value="ar">Arabic</option></select></div>
                </div>
                <input type="url" id="edit_posterUrl" placeholder="Poster URL" required>
                <textarea id="edit_description" rows="2" placeholder="Description (English)" required></textarea>
                <textarea id="edit_descriptionAr" rows="2" placeholder="Description (Arabic)" required></textarea>
                <h4>🎞️ Video Servers</h4>
                <div class="server-group"><label>Server 1</label><input type="text" id="edit_server1_label" placeholder="Label"><input type="url" id="edit_server1_url" placeholder="URL"></div>
                <div class="server-group"><label>Server 2</label><input type="text" id="edit_server2_label" placeholder="Label"><input type="url" id="edit_server2_url" placeholder="URL"></div>
                <div class="server-group"><label>Server 3</label><input type="text" id="edit_server3_label" placeholder="Label"><input type="url" id="edit_server3_url" placeholder="URL"></div>
                <div class="flex-buttons"><button type="submit">💾 Save</button><button type="button" id="editCancelBtn" class="cancel-btn">Cancel</button></div>
            </form>
        </div>

        <hr>
        <h2>➕ Add New Movie</h2>
        <form id="addMovieForm">
            <div class="form-row"><div><input type="text" id="titleEn" placeholder="Title (English)" required></div><div><input type="text" id="titleAr" placeholder="Title (Arabic)" required></div></div>
            <div class="form-row"><div><input type="text" id="year" placeholder="Year" required></div><div><select id="lang" required><option value="both">Both</option><option value="en">English</option><option value="ar">Arabic</option></select></div></div>
            <input type="url" id="posterUrl" placeholder="Poster URL" required>
            <textarea id="description" rows="2" placeholder="Description (English)" required></textarea>
            <textarea id="descriptionAr" rows="2" placeholder="Description (Arabic)" required></textarea>
            <h3>📡 Video Servers (first required)</h3>
            <input type="url" id="server1" placeholder="Server 1 URL" required>
            <input type="url" id="server2" placeholder="Server 2 URL">
            <input type="url" id="server3" placeholder="Server 3 URL">
            <button type="submit">➕ Add Movie (Newest First)</button>
        </form>
        <div class="hint">✅ Sorted: <strong>Newest to Oldest</strong> – 10 movies per page. Edit & Delete now use the correct Firestore document ID.</div>
    </div>
</div>
</body>
</html>
